<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logs</title>
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
<script src="/shell.js" defer></script>
<style>
  .filters label { margin-right: 4px; }
  #jbox { height: calc(100vh - 330px); min-height: 320px; overflow: auto; background: var(--code-bg);
          border: 1px solid var(--line); border-radius: 8px; font: 13px/1.5 var(--mono); }
  .jr { display: grid; grid-template-columns: 150px 190px 1fr; gap: 12px; padding: 2px 12px; border-left: 3px solid transparent; }
  .jr:hover { background: var(--row-hover); }
  .jr .t, .jr .u { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jr .m { white-space: pre-wrap; word-break: break-word; }
  .jr.p0, .jr.p1, .jr.p2, .jr.p3 { border-left-color: var(--crit); }
  .jr.p0 .m, .jr.p1 .m, .jr.p2 .m, .jr.p3 .m { color: var(--log-crit); }
  .jr.p4 { border-left-color: var(--warn); }
  .jr.p4 .m { color: var(--log-warn); }
  .jr.p5 { border-left-color: var(--accent); }
  .jr.p7 .m { color: var(--muted); }
  #jstatus { margin: 8px 2px; font-size: 13px; }
  @media (max-width: 900px) { .jr { grid-template-columns: 1fr; gap: 0; } }
</style>

<h1>Logs</h1>
<p class="muted">The system journal. Newest entries are at the bottom.</p>

<div class="filters" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0">
  <select id="rng" title="Time range">
    <option value="1h">Last hour</option>
    <option value="6h">Last 6 hours</option>
    <option value="24h">Last 24 hours</option>
    <option value="7d">Last 7 days</option>
    <option value="boot" selected>Current boot</option>
    <option value="prevboot">Previous boot</option>
    <option value="all">Everything</option>
  </select>
  <select id="prio" title="Severity">
    <option value="-1">All severities</option>
    <option value="3">Errors and worse</option>
    <option value="4">Warnings and worse</option>
    <option value="5">Notices and worse</option>
    <option value="6">Info and worse</option>
  </select>
  <input id="unit" type="text" list="unitlist" placeholder="Unit, or kernel" autocomplete="off" style="width:210px">
  <datalist id="unitlist"><option value="kernel"></option></datalist>
  <input id="q" type="text" placeholder="Search text" autocomplete="off" style="width:200px">
  <select id="lines" title="How many lines">
    <option>100</option><option selected>200</option><option>500</option><option>1000</option>
  </select>
  <button id="go" class="primary">Search</button>
  <label><input type="checkbox" id="follow"> Follow</label>
  <button id="dl">Download</button>
</div>

<div id="jbox"></div>
<div id="jstatus" class="muted"></div>

<script src="/page/logs.js"></script>
