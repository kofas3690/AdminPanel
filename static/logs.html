<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logs</title>
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
<script src="/shell.js" defer></script>
<style>
  .lbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 14px 0; }
  .lbar label { font-weight: 600; font-size: 13px; }
  .lbar .grp { display: flex; align-items: center; gap: 6px; }
  .lbar .grow { flex: 1 1 auto; }
  #q { width: 230px; }
  #jbox { border-top: 1px solid var(--line); }
  .jday { margin: 22px 4px 6px; font-size: 18px; font-weight: 500; }
  .jboot { margin: 4px 4px 4px 76px; font-style: italic; color: var(--muted); padding: 2px 0; }
  .jr { display: grid; grid-template-columns: 24px 74px 1fr auto; gap: 8px; padding: 5px 4px; align-items: baseline;
        border-bottom: 1px solid var(--line); }
  .jr:hover { background: var(--row-hover); }
  .jr .ic { text-align: center; }
  .jr .t { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .jr .m { white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .jr .u { color: var(--muted); white-space: nowrap; font-size: 13px; }
  .jr .n { display: inline-block; min-width: 18px; text-align: center; margin-left: 6px; padding: 0 6px; border-radius: 10px;
           background: var(--line); font-size: 12px; }
  .jr.p0 .ic, .jr.p1 .ic, .jr.p2 .ic, .jr.p3 .ic { color: var(--crit); }
  .jr.p0 .m, .jr.p1 .m, .jr.p2 .m, .jr.p3 .m { color: var(--log-crit); }
  .jr.p4 .ic { color: var(--warn); }
  .jr.p4 .m { color: var(--log-warn); }
  .jr.p7 .m { color: var(--muted); }
  #jstatus { margin: 10px 4px; font-size: 13px; }
  @media (max-width: 800px) { .jr { grid-template-columns: 24px 74px 1fr; } .jr .u { grid-column: 3; } .jboot { margin-left: 4px; } #q { width: 100%; } }
</style>

<p class="subtabs"><a href="/logs.html" class="on">Journal</a><a href="/logclean.html">Log cleanup</a></p>
<h1>Logs</h1>
<p class="muted">The system journal, newest first. Repeated identical lines are folded into one with a count.</p>

<div class="lbar">
  <div class="grp"><select id="rng" title="Time range">
    <option value="1h">Last hour</option>
    <option value="6h">Last 6 hours</option>
    <option value="24h" selected>Last 24 hours</option>
    <option value="7d">Last 7 days</option>
    <option value="boot">Current boot</option>
    <option value="prevboot">Previous boot</option>
    <option value="all">Everything</option>
  </select></div>
  <div class="grp"><label for="prio">Priority</label><select id="prio">
    <option value="0">Only emergency</option>
    <option value="1">Alert and above</option>
    <option value="2">Critical and above</option>
    <option value="3">Error and above</option>
    <option value="4">Warning and above</option>
    <option value="5">Notice and above</option>
    <option value="6" selected>Info and above</option>
    <option value="7">Debug and above</option>
  </select></div>
  <div class="grp"><label for="ident">Identifier</label><select id="ident"><option value="">All</option></select></div>
  <div class="grp"><input id="q" type="search" placeholder="Search text" autocomplete="off"></div>
  <span class="grow"></span>
  <select id="lines" title="How many entries to load">
    <option>200</option><option selected>500</option><option>1000</option>
  </select>
  <button id="dl">Download</button>
  <button id="pause">Pause</button>
</div>

<div id="jbox"></div>
<div id="jstatus" class="muted"></div>

<script src="/page/logs.js"></script>
