<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File manager</title>
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
<script src="/shell.js" defer></script>
<script src="/sshkey-ui.js" defer></script>
<script src="/files-key.js" defer></script>
<style>
  #lform label { display: block; margin: 10px 0; }
  #lform input { width: 100%; margin-top: 4px; }
  #loginbox { max-width: 460px; }
  .acc { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 10px 0 12px; }
  .acc button { margin: 0; }
  .navrow { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .navrow button { margin: 0; padding: 6px 11px; }
  .addrbar { flex: 1; display: flex; align-items: center; gap: 1px; min-height: 36px; padding: 3px 8px; overflow: hidden;
             background: var(--input); border: 1px solid var(--line2); border-radius: 4px; cursor: text; }
  .addrbar a.crumb { padding: 3px 7px; border-radius: 4px; color: var(--text); white-space: nowrap; cursor: pointer; }
  .addrbar a.crumb:hover { background: var(--panel2); text-decoration: none; }
  .addrbar .sep { color: var(--muted); }
  .addrbar input { flex: 1; border: 0; background: none; padding: 4px; min-width: 0; }
  #filter { width: 200px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 0 10px; }
  .toolbar button { margin: 0; padding: 5px 12px; }
  .toolbar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .fx { display: grid; grid-template-columns: 250px 1fr; height: calc(100vh - 340px); min-height: 380px; overflow: hidden;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  #tree { border-right: 1px solid var(--line); overflow: auto; padding: 8px 4px; }
  #tree .label { margin: 10px 8px 4px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  #main { overflow: auto; position: relative; }
  #main.drag { outline: 2px dashed var(--accent); outline-offset: -6px; }
  .node { user-select: none; }
  .node .row { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .node .row:hover { background: var(--panel2); }
  .node .row.on { background: var(--sel); }
  .node .tg { width: 16px; text-align: center; color: var(--muted); }
  .kids { margin-left: 16px; }
  #list { margin: 0; border: 0; border-radius: 0; background: none; }
  #list th { position: sticky; top: 0; background: var(--panel2); cursor: pointer; user-select: none; z-index: 1; white-space: nowrap; }
  #list td { padding: 6px 12px; border-bottom: 1px solid var(--list-line); white-space: nowrap; }
  #list tr { cursor: default; user-select: none; }
  #list tr.sel td { background: var(--sel); }
  #list tr.cut { opacity: .5; }
  .ico { display: inline-block; width: 18px; height: 18px; vertical-align: -4px; margin-right: 8px; }
  .ico svg { width: 18px; height: 18px; display: block; }
  #empty { padding: 30px; text-align: center; }
  .statusbar { padding: 8px 2px; color: var(--muted); font-size: 13px; }
  .ctx { position: fixed; z-index: 100; min-width: 190px; padding: 5px; background: var(--panel2);
         border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
  .ctx div { padding: 7px 12px; border-radius: 4px; cursor: pointer; }
  .ctx div:hover { background: var(--ctx-hover); }
  .ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; max-width: 94vw; }
  dialog::backdrop { background: var(--backdrop); }
  #editor { width: min(900px, 94vw); }
  #pdlg { width: min(520px, 94vw); }
  @media (max-width: 900px) { .fx { grid-template-columns: 1fr; } #tree { display: none; } #filter { width: 120px; } }
</style>

<h1>File manager</h1>
<p class="muted">Browse this server as a Linux account. You see exactly what that account can see, and never anything that needs root.</p>

<div id="loginbox" class="card" hidden>
  <h3>Sign in to an account</h3>
  <form id="lform">
    <label>Linux user name <input id="luser" type="text" autocomplete="off" required></label>
    <label>Password <input id="lpass" type="password" autocomplete="off" required></label>
    <button class="primary">Connect</button>
    <button type="button" id="lcancel" hidden>Cancel</button>
    <p id="lmsg" class="crit"></p>
  </form>
  <p class="muted">The root account can't be used here. The password is checked by the SSH server and is never stored.</p>
</div>

<div id="explorer" hidden>
  <div class="acc">
    <label>Account <select id="acct"></select></label>
    <button id="addacct">Connect another\u2026</button>
    <button id="disc">Disconnect</button>
  </div>

  <div class="navrow">
    <button id="back" title="Back (Alt+Left)">\u2190</button>
    <button id="fwd" title="Forward (Alt+Right)">\u2192</button>
    <button id="up" title="Up one level (Backspace)">\u2191</button>
    <button id="refresh" title="Refresh">\u27f3</button>
    <div class="addrbar" id="addr"></div>
    <input id="filter" type="text" placeholder="Filter this folder" autocomplete="off">
  </div>

  <div class="toolbar">
    <button id="bfolder">New folder</button>
    <button id="bfile">New file</button>
    <button id="bupload">Upload</button>
    <span class="sep"></span>
    <button id="bdownload">Download</button>
    <button id="bcut">Cut</button>
    <button id="bcopy">Copy</button>
    <button id="bpaste">Paste</button>
    <span class="sep"></span>
    <button id="brename">Rename</button>
    <button id="bdelete">Delete</button>
    <button id="bprops">Properties</button>
    <span class="sep"></span>
    <label><input type="checkbox" id="chkhidden"> Show hidden files</label>
  </div>

  <div class="fx">
    <aside id="tree"></aside>
    <section id="main">
      <table id="list">
        <thead>
          <tr>
            <th data-k="name">Name</th><th data-k="mtime">Modified</th><th data-k="type">Type</th>
            <th data-k="size">Size</th><th>Permissions</th><th>Owner</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="muted" hidden></div>
    </section>
  </div>
  <div class="statusbar" id="status"></div>
</div>

<input type="file" id="picker" multiple hidden>
<div id="ctx" class="ctx" hidden></div>

<dialog id="editor">
  <h2 id="etitle" style="margin-top:0"></h2>
  <textarea id="etext" spellcheck="false"></textarea>
  <p><button id="esave" class="primary">Save</button><button id="eclose">Close</button> <span id="emsg" class="muted"></span></p>
</dialog>

<dialog id="pdlg">
  <h2 id="ptitle" style="margin-top:0"></h2>
  <table class="props"><tbody id="pbody"></tbody></table>
  <p><button id="pclose">Close</button></p>
</dialog>

<script src="/page/files.js"></script>
