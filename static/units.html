<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services</title>
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
<script src="/shell.js" defer></script>
<style>
  .acctbar { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin: 0 0 14px; padding: 10px 14px;
             background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .acctbar select { min-width: 150px; margin-left: 6px; }
  .acctbar button { margin: 0; }
</style>

<p class="subtabs"><a href="/units.html" class="on">Services</a><a href="/cron.html">Cron jobs</a><a href="/containers.html">Containers</a><a href="/compose.html">Compose</a><a href="/startup.html">Startup</a><a href="/websites.html">Websites</a><a href="/weblogs.html">Web logs</a></p>
<div id="listview">
  <div class="top">
    <div class="seg" id="tabs">
      <button data-t="service" class="on">Services</button>
      <button data-t="target">Targets</button>
      <button data-t="socket">Sockets</button>
      <button data-t="timer">Timers</button>
      <button data-t="path">Paths</button>
    </div>
    <div class="seg side" id="scopes">
      <button data-s="system" class="on">System</button>
      <button data-s="user">User</button>
    </div>
  </div>

  <div class="acctbar" id="acctbar" hidden>
    <label>Account <select id="acct"></select></label>
    <span id="acctstate" class="muted"></span>
    <button id="startmgr" hidden>Start service manager</button>
    <label id="lingerbox" hidden title="Lets this account's services start at boot and keep running when nobody is logged in">
      <input type="checkbox" id="linger"> Keep running after logout</label>
  </div>

  <div class="filters">
    <input id="q" type="text" placeholder="Filter by name or description" autocomplete="off">
    <select id="fa">
      <option value="all">Active state</option>
      <option value="active">Active (running)</option>
      <option value="inactive">Inactive (not running)</option>
      <option value="failed">Failed</option>
    </select>
    <select id="ff">
      <option value="all">File state</option>
      <option value="enabled">Enabled</option>
      <option value="disabled">Disabled</option>
      <option value="static">Static</option>
      <option value="masked">Masked</option>
      <option value="other">Other</option>
    </select>
    <span id="count" class="muted"></span>
  </div>
  <table>
    <thead id="thead"></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div id="detailview" hidden>
  <p><a id="back" href="#">&larr; All services</a></p>
  <h1 id="dtitle"></h1>
  <p id="dscope" class="muted"></p>
  <p id="ddesc" class="muted"></p>
  <p>State: <strong id="dstate"></strong> &nbsp; File: <span id="dfile"></span></p>
  <p id="dactions"></p>
  <p id="dreason" class="warn"></p>
  <p><span id="dmsg" class="muted"></span><span id="derr" class="crit"></span></p>

  <h2>Details</h2>
  <table class="props"><tbody id="dprops"></tbody></table>

  <h2>Relationships</h2>
  <table class="props"><tbody id="drels"></tbody></table>

  <h2>Status</h2>
  <pre id="dstatus"></pre>

  <h2>Logs</h2>
  <p>
    <select id="lines"><option>100</option><option selected>200</option><option>500</option><option>1000</option></select>
    <button class="act" id="reload">Refresh</button>
    <label><input type="checkbox" id="auto"> Auto-refresh</label>
  </p>
  <pre id="logbox"></pre>
</div>

<script src="/page/units.js"></script>
