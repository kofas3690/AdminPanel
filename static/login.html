<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
<body class="login">
<main class="login-card">
  <h1>Admin Panel</h1>
  <p class="muted">Sign in to manage this server</p>
  <form id="f">
    <label>Username
      <input id="u" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input id="p" type="password" autocomplete="current-password" required>
    </label>
    <label>Authentication code
      <input id="c" autocomplete="one-time-code" maxlength="16" placeholder="6 digits, or a recovery code">
    </label>
    <button class="primary" id="go">Sign in</button>
    <p id="err" class="crit" role="alert"></p>
  </form>
</main>
<script src="/page/login.js"></script>
