<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="stylesheet" href="/app.css">
<body class="login">
<main class="login-card">
  <h1>Admin Panel</h1>
  <p class="muted">Sign in to manage this server</p>
  <form id="f">
    <label>Username
      <input id="u" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input id="p" type="password" autocomplete="current-password" required>
    </label>
    <label>Authentication code
      <input id="c" autocomplete="one-time-code" maxlength="16" placeholder="6 digits, or a recovery code">
    </label>
    <button class="primary" id="go">Sign in</button>
    <p id="err" class="crit" role="alert"></p>
  </form>
</main>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true;
  err.textContent = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("u").value,
        password: document.getElementById("p").value,
        code: document.getElementById("c").value,
      }),
    });
    if (r.ok) { location.href = "/"; return; }
    let msg = "Sign-in failed";
    try { const j = await r.json(); if (typeof j.detail === "string") msg = j.detail; } catch (x) {}
    err.textContent = msg;
  } catch (x) {
    err.textContent = "Could not reach the server";
  }
  go.disabled = false;
});
</script>
