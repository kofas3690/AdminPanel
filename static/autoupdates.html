<h1>Automatic updates</h1>
<p class="muted">When this is on, the machine installs security updates by itself every day, so a known hole does not stay open
while nobody is looking. It does not restart the machine; the Overview page tells you when a restart is needed.</p>
<p id="err" class="crit"></p>
<p id="banner" class="muted"></p>
<p class="state" id="state"></p>
<p><button id="toggle" hidden></button></p>
<p class="muted" id="detail"></p>
<h2 id="loghead" hidden>Last run</h2>
<pre id="logbox" hidden></pre>
