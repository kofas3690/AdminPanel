<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview</title>
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
<script src="/shell.js" defer></script>

<h1>Overview</h1>
<p id="subtitle" class="muted">loading…</p>

<div class="cards">
  <div class="card">
    <h3>CPU</h3>
    <div class="big" id="cpu">–</div>
    <div class="bar" id="cpubar"><i></i></div>
    <canvas id="cpuspark" width="300" height="44"></canvas>
    <div class="muted" id="cpuinfo"></div>
  </div>
  <div class="card">
    <h3>Memory</h3>
    <div class="big" id="mem">–</div>
    <div class="bar" id="membar"><i></i></div>
    <canvas id="memspark" width="300" height="44"></canvas>
    <div class="muted" id="meminfo"></div>
  </div>
  <div class="card">
    <h3>Disk (/)</h3>
    <div class="big" id="disk">–</div>
    <div class="bar" id="diskbar"><i></i></div>
    <div class="muted" id="diskinfo"></div>
    <div class="muted"><a href="/storage.html">Storage details</a></div>
  </div>
  <div class="card">
    <h3>Network</h3>
    <div class="big" id="net">–</div>
    <canvas id="netspark" width="300" height="44"></canvas>
    <div class="muted" id="netinfo"></div>
  </div>
</div>

<h2>System information</h2>
<table class="kv"><tbody id="sysinfo"></tbody></table>

<h2>Services</h2>
<table>
  <thead><tr><th>Name</th><th>State</th><th>Description</th><th>Actions</th></tr></thead>
  <tbody id="svc"></tbody>
</table>
<p class="muted"><a href="/units.html">All services</a></p>

<h2>Service logs <span id="logname" class="muted"></span></h2>
<p><button id="logstop">Stop</button></p>
<pre id="logbox"></pre>

<script src="/page/index.js"></script>
